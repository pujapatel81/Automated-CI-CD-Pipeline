
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #475569;
            font-size: 17px;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
        }

        .tools {
            margin-top: 30px;
            line-height: 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Automated CI/CD Pipeline</h1>

        <p>Welcome to my DevOps project!</p>

        <div class="status">
            Application is Running
        </div>

        <div class="tools">
            <h3>Technologies Used</h3>
            <p>Java | Spring Boot | Maven</p>
            <p>Jenkins | Docker | GitHub</p>
            <p>AWS EC2</p>
        </div>

        <p>Build, Test and Deployment Automation</p>
    </div>
</body>
</html>
